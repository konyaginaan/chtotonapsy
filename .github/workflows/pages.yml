name: Журнал на GitHub Pages

# Воркер запускает сборку сразу после нажатия «Опубликовать» (repository_dispatch).
# Раз в час — страховка, если запуск не дошёл.
on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: [tools/build_pages.py, .github/workflows/pages.yml, public/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
